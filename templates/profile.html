<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Profilul Meu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .brutal-shadow { box-shadow: 6px 6px 0px 0px rgba(0,0,0,1); }
        .brutal-shadow-sm { box-shadow: 4px 4px 0px 0px rgba(0,0,0,1); }
    </style>
</head>
<body class="bg-[#feca36] text-black font-sans min-h-screen flex flex-col">

    <!-- Navigare -->
    <nav class="p-6 flex justify-between items-center border-b-4 border-black bg-white">
        <a href="{% url 'index' %}" class="text-3xl font-black tracking-tighter uppercase">MERSUL TRENURILOR</a>
        <div class="space-x-6 font-bold uppercase text-sm hidden md:block">
            <a href="{% url 'search' %}" class="hover:underline decoration-4 underline-offset-4">Căutare Nouă</a>
            <a href="{% url 'logout' %}" class="bg-black text-white px-5 py-2 border-2 border-black hover:bg-white hover:text-black transition brutal-shadow-sm">Deconectare</a>
        </div>
    </nav>

    <!-- Container Formular (centrat pe spațiul rămas) -->
    <div class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white border-4 border-black brutal-shadow p-10 w-full max-w-xl my-8">
            <h2 class="text-4xl font-black uppercase mb-8 border-b-4 border-black pb-4">Profilul Tău</h2>
            
            <form action="profile.html" method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <!-- Zona Avatar Brutalist -->
                <div class="flex flex-col items-center mb-10">
                    <div class="w-32 h-32 border-4 border-black brutal-shadow mb-4 relative group bg-yellow-100 overflow-hidden">
                        <!-- Placeholder retro avatar -->
                        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Tren&backgroundColor=feca36" alt="Avatar" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-black bg-opacity-80 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
                            <span class="text-white font-black uppercase text-sm">Modifică</span>
                        </div>
                        <input type="file" name="avatar" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    </div>
                </div>

                <!-- Rândul 1: Prenume și Nume -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-5">
                    <div>
                        <label class="block font-black mb-2 uppercase">Prenume</label>
                        <input type="text" name="first_name" value="{{ user.first_name }}" class="w-full border-4 border-black p-3 font-bold focus:outline-none focus:bg-yellow-100 transition">
                    </div>
                    <div>
                        <label class="block font-black mb-2 uppercase">Nume</label>
                        <input type="text" name="last_name" value="{{ user.last_name }}" class="w-full border-4 border-black p-3 font-bold focus:outline-none focus:bg-yellow-100 transition">
                    </div>
                </div>

                <!-- Rândul 2: Nume utilizator -->
                <div class="mb-5">
                    <label class="block font-black uppercase mb-2">Nume utilizator</label>
                    <input type="text" name="username" value="{{ user.username }}" class="w-full border-4 border-black p-3 font-bold focus:outline-none focus:bg-yellow-100 transition">
                </div>

                <!-- Rândul 3: Email (Readonly) -->
                <div class="mb-8">
                    <label class="block font-black uppercase mb-2">Email (Doar citire)</label>
                    <!-- Câmp blocat (readonly) pentru că email-ul se schimbă greu din motive de securitate -->
                    <input type="email" name="email" value="{{ user.email }}" class="w-full border-4 border-black p-3 font-bold bg-gray-200 cursor-not-allowed outline-none" readonly>
                </div>

                <button type="submit" class="w-full bg-[#feca36] text-black font-black uppercase py-4 border-4 border-black hover:bg-black hover:text-white transition brutal-shadow mb-4">
                    Salvează Modificările
                </button>
            </form>

            <!-- Alerte Django -->
            {% if messages %}
                <div class="mt-6 space-y-2">
                    {% for message in messages %}
                        <div class="bg-black text-white p-3 font-bold border-4 border-black brutal-shadow text-sm text-center">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        </div>
    </div>

</body>
</html>
