<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <title>Înregistrare Cont Nou</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .brutal-shadow {
            box-shadow: 6px 6px 0px 0px rgba(0, 0, 0, 1);
        }

        .brutal-shadow-sm {
            box-shadow: 4px 4px 0px 0px rgba(0, 0, 0, 1);
        }

        @keyframes buzz {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-5px);
            }

            40% {
                transform: translateX(5px);
            }

            60% {
                transform: translateX(-5px);
            }

            80% {
                transform: translateX(5px);
            }
        }

        .animate-buzz {
            animation: buzz 0.4s ease-in-out;
        }
    </style>
</head>

<body class="bg-[#feca36] text-black font-sans min-h-screen flex flex-col">

    <!-- Navigare -->
    <nav class="p-6 flex justify-between items-center border-b-4 border-black bg-white">
        <a href="{% url 'index' %}" class="text-3xl font-black tracking-tighter uppercase">MERSUL TRENURILOR</a>
        <div class="space-x-6 font-bold uppercase text-sm hidden md:block">
            <a href="{% url 'search' %}" class="hover:underline decoration-4 underline-offset-4">Căutare</a>
            <a href="{% url 'login' %}" class="hover:underline decoration-4 underline-offset-4">Login</a>
        </div>
    </nav>

    <!-- Container Formular (centrat pe spațiul rămas) -->
    <div class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white border-4 border-black brutal-shadow p-10 w-full max-w-2xl my-8">

            <div class="text-center mb-8">
                <h1 class="text-4xl font-black tracking-tighter mb-2">Creare Cont Nou</h1>
            </div>

            <form action="{% url 'register' %}" method="POST">

                {% csrf_token %}

                <!-- Rândul 1: Prenume și Nume -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-5">
                    <div>
                        <label class="block font-black mb-2">Prenume</label>
                        <input type="text" name="first_name"
                            class="w-full border-4 border-black p-3 font-bold focus:outline-none focus:bg-yellow-100 transition"
                            required>
                    </div>
                    <div>
                        <label class="block font-black mb-2">Nume</label>
                        <input type="text" name="last_name"
                            class="w-full border-4 border-black p-3 font-bold focus:outline-none focus:bg-yellow-100 transition"
                            required>
                    </div>
                </div>

                <!-- Rândul 2: Email -->
                <div class="mb-5">
                    <label class="block font-black mb-2">Email</label>
                    <input type="email" name="email"
                        class="w-full border-4 border-black p-3 font-bold focus:outline-none focus:bg-yellow-100 transition"
                        required>
                </div>

                <!-- Rândul 3: Nume utilizator -->
                <div class="mb-5">
                    <label class="block font-black mb-2">Nume utilizator</label>
                    <input type="text" name="username"
                        class="w-full border-4 border-black p-3 font-bold focus:outline-none focus:bg-yellow-100 transition"
                        required>
                </div>

                <!-- Rândul 4: Parolă și Confirmă Parola -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div>
                        <label class="block font-black mb-2">Parolă</label>
                        <input type="password" name="password"
                            class="w-full border-4 border-black p-3 font-bold focus:outline-none focus:bg-yellow-100 transition"
                            required>
                    </div>
                    <div>
                        <label class="block font-black mb-2">Confirmă Parola</label>
                        <input type="password" name="confirm_password"
                            class="w-full border-4 border-black p-3 font-bold focus:outline-none focus:bg-yellow-100 transition"
                            required>
                    </div>
                </div>

                <!-- Buton -->
                <button type="submit"
                    class="w-full bg-black text-white font-black py-4 border-4 border-black hover:bg-[#feca36] hover:text-black transition brutal-shadow mb-6 hover:translate-y-1 hover:translate-x-1 hover:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] transition-all">
                    Înregistrare
                </button>
            </form>

            <p class="text-center font-bold text-sm mb-4">
                Ai deja un cont? <a href="{% url 'login' %}"
                    class="hover:underline decoration-4 underline-offset-4 transition">Autentifică-te</a>
            </p>

            {% if messages %}
            <div class="mt-6 space-y-2">
                {% for message in messages %}
                <!-- Doar text negru, îngroșat, centrat și animația de buzz -->
                <div class="text-black font-black text-sm text-center animate-buzz">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

        </div>
    </div>

</body>

</html>
